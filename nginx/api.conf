# =====================================================================
# SensorLab · Reverse proxy para a API (requisito R7)
# Colar DENTRO do bloco "server { listen 443 ssl; ... }" do site
# srv.grupoN.lab (criado na aula 5), e depois:
#     sudo nginx -t && sudo systemctl reload nginx
#
# https://srv.grupoN.lab/api/atividades  ->  http://127.0.0.1:3000/atividades
# A barra no fim do proxy_pass retira o prefixo /api/ antes de passar o pedido.
# =====================================================================
location /api/ {
    proxy_pass         http://127.0.0.1:3000/;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
}
